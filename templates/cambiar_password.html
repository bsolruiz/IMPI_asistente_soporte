<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMPI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">IMPI</div>
      <div class="sub" data-i18n="cp_sub"></div>

      <div id="err" class="err"></div>

      <div class="field">
        <label for="p1" data-i18n="cp_nueva"></label>
        <input id="p1" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="p2" data-i18n="cp_repetir"></label>
        <input id="p2" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="field-help" data-i18n="cp_ayuda" style="margin:-6px 0 14px;"></div>
      <button class="btn" id="btn-guardar" data-i18n="cp_btn"></button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('impi_token');
    if (!token || localStorage.getItem('impi_rol') !== 'cliente') window.location.href = '/';

    const errBox = document.getElementById('err');
    function showErr(msg) { errBox.textContent = msg; errBox.classList.add('show'); }

    async function guardar() {
      errBox.classList.remove('show');
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      if (p1.length < 6) { showErr(t('cp_err_corta')); return; }
      if (p1 !== p2) { showErr(t('cp_err_match')); return; }

      try {
        const res = await fetch('/api/cambiar-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ password: p1 }),
        });
        if (res.status === 401) { localStorage.clear(); window.location.href = '/'; return; }
        const data = await res.json();
        if (!res.ok) { showErr(data.error || t('cp_err_generico')); return; }
        localStorage.setItem('impi_debe_cambiar', '');
        window.location.href = '/chat';
      } catch (e) {
        showErr(t('err_conn'));
      }
    }

    document.getElementById('btn-guardar').addEventListener('click', guardar);
    document.getElementById('p2').addEventListener('keydown', e => {
      if (e.key === 'Enter') guardar();
    });
  </script>
</body>
</html>
